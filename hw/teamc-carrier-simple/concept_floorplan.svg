<rect x="152.0" y="48.0" width="260.0" height="224.0" fill="#d9ead3" stroke="#333" stroke-width="1.2" />
<text x="282.0" y="155.0" font-size="13" text-anchor="middle" fill="#111">Raspberry Pi 3 A+</text>
<text x="282.0" y="172.0" font-size="11" text-anchor="middle" fill="#444">65 x 56 mm, on its own standoffs</text>
<rect x="180.0" y="236.0" width="204.0" height="24.0" fill="#b6d7a8" stroke="#333" stroke-width="1.2" />
<text x="282.0" y="252.0" font-size="11" text-anchor="middle" fill="#111">40-pin header</text>
<rect x="50.0" y="280.0" width="480.0" height="252.0" fill="#fdf6e3" stroke="#333" stroke-width="1.2" />
<rect x="60.0" y="296.0" width="124.0" height="150.0" fill="#cfe2f3" stroke="#333" stroke-width="1.2" />
<text x="122.0" y="366.0" font-size="12" text-anchor="middle" fill="#111">SP4 breakout</text>
<text x="122.0" y="383.0" font-size="10" text-anchor="middle" fill="#444">plugs into a 1x8 socket</text>
<rect x="208.0" y="290.0" width="224.0" height="36.0" fill="#e6e6e6" stroke="#333" stroke-width="1.2" />
<text x="320.0" y="312.0" font-size="11" text-anchor="middle" fill="#111">2x20 box header (ribbon to the Pi)</text>
