<text x="479.6" y="324.0" font-size="8" text-anchor="middle" fill="#444">#5388</text>
<rect x="200.0" y="438.0" width="312.0" height="84.0" fill="#fff2cc" stroke="#333" stroke-width="1.2" />
<text x="356.0" y="475.0" font-size="12" text-anchor="middle" fill="#111">18650 cell holder (on the board)</text>
<text x="356.0" y="492.0" font-size="10" text-anchor="middle" fill="#444">MPD BH-18650-PC</text>
<rect x="72.0" y="460.0" width="56.0" height="28.0" fill="#cfe2f3" stroke="#333" stroke-width="1.2" />
<text x="100.0" y="478.0" font-size="10" text-anchor="middle" fill="#111">3.3 V LDO</text>
<rect x="484.0" y="348.0" width="40.0" height="80.0" fill="#d9d2e9" stroke="#333" stroke-width="1.2" />
<text x="504.0" y="392.0" font-size="10" text-anchor="middle" fill="#111">leads</text>
<rect x="60.0" y="496.0" width="120.0" height="28.0" fill="#d9d2e9" stroke="#333" stroke-width="1.2" />
<text x="120.0" y="514.0" font-size="10" text-anchor="middle" fill="#111">UI leads + UART</text>
<text x="574.0" y="54" font-size="13" fill="#222">Box floor: ASSUMED 125 x 125 mm</text>
<text x="574.0" y="72" font-size="13" fill="#222">(inside, at the bottom; to measure)</text>
<text x="574.0" y="90" font-size="13" fill="#222"></text>
<text x="574.0" y="108" font-size="13" fill="#222">West wall: flex antenna, high,</text>
<text x="574.0" y="126" font-size="13" fill="#222">vertical (U.FL cable to the SP4)</text>
<text x="574.0" y="144" font-size="13" fill="#222"></text>
<text x="574.0" y="162" font-size="13" fill="#222">East wall: panel - power toggle,</text>
<text x="574.0" y="180" font-size="13" fill="#222">GO/STOP, role, mode, 2 LEDs,</text>
<text x="574.0" y="198" font-size="13" fill="#222">USB-C charger; Pi USB-A port</text>
<text x="574.0" y="216" font-size="13" fill="#222"></text>
<text x="574.0" y="234" font-size="13" fill="#222">Carrier: one copper layer,</text>
<text x="574.0" y="252" font-size="13" fill="#222">about 120 x 63 mm</text>
<text x="574.0" y="270" font-size="13" fill="#222">(fits a 160 x 100 mm lab blank)</text>
<text x="574.0" y="288" font-size="13" fill="#222"></text>
<text x="574.0" y="306" font-size="13" fill="#222">Sketch only - positions change</text>
<text x="574.0" y="324" font-size="13" fill="#222">once the box is measured.</text>
<text x="40" y="26" font-size="15" fill="#222">Carrier rev C - concept floorplan (top view of the box floor, component side up)</text>
<text x="28" y="290.0" font-size="13" fill="#555" text-anchor="middle" transform="rotate(-90 28 290.0)">west wall</text>
<text x="552.0" y="290.0" font-size="13" fill="#555" text-anchor="middle" transform="rotate(90 552.0 290.0)">east wall (panel)</text>
</svg>