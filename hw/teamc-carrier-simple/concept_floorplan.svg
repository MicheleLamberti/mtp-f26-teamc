<text x="250.8" y="379.6" font-size="11" text-anchor="middle" fill="#111">fuel gauge</text>
<text x="250.8" y="396.6" font-size="9" text-anchor="middle" fill="#444">Adafruit #5580</text>
<rect x="312.0" y="344.0" width="162.4" height="60.8" fill="#fce5cd" stroke="#333" stroke-width="1.2" />
<text x="393.2" y="369.4" font-size="12" text-anchor="middle" fill="#111">5 V boost</text>
<text x="393.2" y="386.4" font-size="10" text-anchor="middle" fill="#444">Pololu U3V70F5</text>
<rect x="444.0" y="290.0" width="71.2" height="44.0" fill="#fce5cd" stroke="#333" stroke-width="1.2" />
