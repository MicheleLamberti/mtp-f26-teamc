name: File encoding and transfer tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev g++-arm-linux-gnueabihf g++-aarch64-linux-gnu
      - name: Binary transfer and encoding tests
        run: make -C proto/test_encoding_text test
      - name: Existing radio tests
        run: make -C radio/fw test
      - name: Existing protocol tests
        run: make -C proto test
      - name: Radio configuration checks
        run: python3 radio/phy_config.py
      - name: Raspberry Pi ARM builds (32-bit and 64-bit)
        working-directory: proto/test_encoding_text
        run: |
          arm-linux-gnueabihf-g++ -D_FILE_OFFSET_BITS=64 -std=c++17 -O2 -Wall -Wextra -Werror encoding_stream.cpp main.cpp -o build/encoding_stream_armhf
          aarch64-linux-gnu-g++ -D_FILE_OFFSET_BITS=64 -std=c++17 -O2 -Wall -Wextra -Werror encoding_stream.cpp main.cpp -o build/encoding_stream_aarch64
